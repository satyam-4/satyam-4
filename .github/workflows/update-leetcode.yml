name: Update LeetCode Stats

on:
  schedule:
    - cron: "0 3 * * *"   
  workflow_dispatch:        

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stats and update README
        run: node scripts/update-leetcode-stats.js

      - name: Commit changes if README was updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update LeetCode stats"
          git push