name: Update LeetCode Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stats and update README
        run: node scripts/update-leetcode-stats.js

      - name: Commit and push changes if README was updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update LeetCode stats"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push rejected (attempt $attempt/5), rebasing onto latest main..."
            git fetch origin main
            git rebase origin/main

            sleep $((attempt * 3))
          done

          echo "Failed to push after multiple attempts."
          exit 1
